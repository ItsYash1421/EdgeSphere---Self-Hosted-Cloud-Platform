apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edgesphere-ingress
  namespace: edgesphere
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "5g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts: ["edgesphere.yourdomain.com", "cdn.yourdomain.com", "dashboard.yourdomain.com"]
    secretName: edgesphere-tls
  rules:
  - host: edgesphere.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: gateway, port: { number: 3000 } }
  - host: cdn.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: cdn-service-a, port: { number: 8080 } }
  - host: dashboard.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: dashboard, port: { number: 3100 } }
