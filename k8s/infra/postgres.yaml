apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: edgesphere
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: timescale/timescaledb:latest-pg15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: edgesphere
        - name: POSTGRES_USER
          value: edgesphere
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edgesphere-secrets
              key: DB_PASSWORD
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: 1000m, memory: 2Gi }
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "edgesphere"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "edgesphere"]
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: edgesphere
spec:
  selector: { app: postgres }
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
