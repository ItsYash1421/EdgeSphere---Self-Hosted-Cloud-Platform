apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: edgesphere
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edgesphere-secrets
              key: REDIS_PASSWORD
        command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
        readinessProbe:
          exec:
            command: ["sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping"]
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: edgesphere
spec:
  selector: { app: redis }
  ports:
  - port: 6379
    targetPort: 6379
