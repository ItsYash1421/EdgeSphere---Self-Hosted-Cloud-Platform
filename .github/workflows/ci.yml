name: CI — Test, Lint, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.22'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────────
  # TypeScript Services
  # ─────────────────────────────────────────────
  ts-lint-test:
    name: TypeScript — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Lint all packages
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  # ─────────────────────────────────────────────
  # Go Edge Server
  # ─────────────────────────────────────────────
  go-test:
    name: Go — Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge-server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/edge-server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" \
            -o /tmp/edge-server ./cmd/server

  # ─────────────────────────────────────────────
  # Docker Build Validation
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker — Build All Images
    runs-on: ubuntu-latest
    needs: [ts-lint-test, go-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build edge-server image
        uses: docker/build-push-action@v5
        with:
          context: apps/edge-server
          file: apps/edge-server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Deploy (only on main branch)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy — Push to Registry
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/edgesphere-auth:latest
            ${{ secrets.DOCKER_USERNAME }}/edgesphere-auth:${{ github.sha }}

      - name: Build and push edge-server
        uses: docker/build-push-action@v5
        with:
          context: apps/edge-server
          file: apps/edge-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/edgesphere-edge:latest
            ${{ secrets.DOCKER_USERNAME }}/edgesphere-edge:${{ github.sha }}
