name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v3
      with: { version: 9 }
    - uses: actions/setup-node@v4
      with: { node-version: 20, cache: pnpm }
    - run: pnpm install --frozen-lockfile
    - run: pnpm run lint
    - run: pnpm run typecheck

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env: { POSTGRES_DB: edgesphere_test, POSTGRES_USER: edgesphere, POSTGRES_PASSWORD: test }
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v3
      with: { version: 9 }
    - uses: actions/setup-node@v4
      with: { node-version: 20, cache: pnpm }
    - run: pnpm install --frozen-lockfile
    - run: pnpm run test --filter=@edgesphere/auth-service
    - run: pnpm run test --filter=@edgesphere/gateway
    - run: pnpm run test --filter=@edgesphere/storage-service
    - run: pnpm run test --filter=@edgesphere/analytics-service
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: edgesphere
        DB_PASSWORD: test
        DB_NAME: edgesphere_test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: test-secret-for-ci

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: auth-service
            context: apps/auth-service
            image: edgesphere-auth
          - name: gateway
            context: apps/gateway
            image: edgesphere-gateway
          - name: storage-service
            context: apps/storage-service
            image: edgesphere-storage
          - name: analytics-service
            context: apps/analytics-service
            image: edgesphere-analytics
          - name: cache-service
            context: apps/cache-service
            image: edgesphere-cache
          - name: cdn-service
            context: apps/cdn-service
            image: edgesphere-cdn
          - name: notification-service
            context: apps/notification-service
            image: edgesphere-notifications
          - name: websocket-gateway
            context: apps/websocket-gateway
            image: edgesphere-websocket
          - name: dashboard
            context: apps/dashboard
            image: edgesphere-dashboard
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service.context }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image }}:latest
          ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image }}:${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.service.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - run: aws eks update-kubeconfig --name edgesphere-dev --region us-east-1
    - name: Deploy to dev
      run: |
        kubectl set image deployment/gateway gateway=ghcr.io/${{ github.repository_owner }}/edgesphere-gateway:${{ github.sha }} -n edgesphere
        kubectl set image deployment/auth-service auth-service=ghcr.io/${{ github.repository_owner }}/edgesphere-auth:${{ github.sha }} -n edgesphere
        kubectl set image deployment/storage-service storage-service=ghcr.io/${{ github.repository_owner }}/edgesphere-storage:${{ github.sha }} -n edgesphere
        kubectl set image deployment/analytics-service analytics-service=ghcr.io/${{ github.repository_owner }}/edgesphere-analytics:${{ github.sha }} -n edgesphere
        kubectl set image deployment/cache-service cache-service=ghcr.io/${{ github.repository_owner }}/edgesphere-cache:${{ github.sha }} -n edgesphere
        kubectl set image deployment/cdn-service cdn-service=ghcr.io/${{ github.repository_owner }}/edgesphere-cdn:${{ github.sha }} -n edgesphere
        kubectl set image deployment/notification-service notification-service=ghcr.io/${{ github.repository_owner }}/edgesphere-notifications:${{ github.sha }} -n edgesphere
        kubectl set image deployment/websocket-gateway websocket-gateway=ghcr.io/${{ github.repository_owner }}/edgesphere-websocket:${{ github.sha }} -n edgesphere
        kubectl set image deployment/dashboard dashboard=ghcr.io/${{ github.repository_owner }}/edgesphere-dashboard:${{ github.sha }} -n edgesphere
        kubectl rollout status deployment/gateway -n edgesphere --timeout=300s
