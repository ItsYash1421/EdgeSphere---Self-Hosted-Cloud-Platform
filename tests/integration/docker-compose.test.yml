# Minimal infra for integration tests
version: '3.9'
services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: edgesphere_test
      POSTGRES_USER: edgesphere
      POSTGRES_PASSWORD: test_secret
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "edgesphere"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs: /var/lib/postgresql/data  # In-memory for speed
  
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123test
    ports: ["9000:9000", "9001:9001"]
    tmpfs: /data
