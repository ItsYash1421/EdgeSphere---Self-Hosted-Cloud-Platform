events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ─── Logging ───────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # ─── Performance ──────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 5g;

  # ─── Gzip Compression ─────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  # ─── Upstreams ────────────────────────────
  upstream api_gateway {
    server api-gateway:3000;
    keepalive 32;
  }

  upstream dashboard {
    server dashboard:3000;
    keepalive 32;
  }

  upstream edge_a {
    server edge-server-a:8080;
    keepalive 32;
  }

  upstream edge_b {
    server edge-server-b:8081;
    keepalive 32;
  }

  # ─── Rate Limiting ────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=cdn:10m rate=1000r/m;

  # ─── Server: Dashboard ────────────────────
  server {
    listen 80;
    server_name localhost;

    # Dashboard
    location / {
      proxy_pass http://dashboard;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # API Gateway
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api_gateway/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # CDN Edge (round-robin between edges)
    location /cdn/ {
      limit_req zone=cdn burst=100 nodelay;

      # Add cache control headers
      add_header X-Edge-Served "true" always;

      proxy_pass http://edge_a/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # Health check
    location /health {
      access_log off;
      return 200 '{"status":"ok","service":"nginx"}';
      add_header Content-Type application/json;
    }
  }
}
