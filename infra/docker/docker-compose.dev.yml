version: '3.9'

# Load master environment variables
# Run: docker compose --env-file ../../.env -f docker-compose.dev.yml up

services:
  # ─────────────────────────────
  # Infrastructure
  # ─────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: edgesphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edgesphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgesphere_secret}
      POSTGRES_DB: ${POSTGRES_DB:-edgesphere}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - edgesphere-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edgesphere}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edgesphere-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - edgesphere-net
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: edgesphere-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - edgesphere-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  kafka:
    image: apache/kafka:3.7.0
    container_name: edgesphere-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - edgesphere-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────
  # Monitoring Stack
  # ─────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: edgesphere-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - edgesphere-net

  grafana:
    image: grafana/grafana:latest
    container_name: edgesphere-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-worldmap-panel
    ports:
      - "${GRAFANA_PORT:-3200}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - edgesphere-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: edgesphere-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - edgesphere-net

  loki:
    image: grafana/loki:latest
    container_name: edgesphere-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/loki
    networks:
      - edgesphere-net

  # ─────────────────────────────
  # Application Services
  # ─────────────────────────────

  # 🖥️  Frontend Dashboard — Port 3000 (FE)
  dashboard:
    build:
      context: ../../
      dockerfile: apps/dashboard/Dockerfile
    container_name: edgesphere-dashboard
    restart: unless-stopped
    env_file:
      - ../../apps/dashboard/.env
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    networks:
      - edgesphere-net

  # 🚦  API Gateway — Port 8080 (BE entry point)
  api-gateway:
    build:
      context: ../../
      dockerfile: apps/gateway/Dockerfile
    container_name: edgesphere-gateway
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-edgesphere-super-secret-jwt-key-change-in-production}
      AUTH_SERVICE_URL: http://edgesphere-auth:3001
      STORAGE_SERVICE_URL: http://edgesphere-storage:3002
      ANALYTICS_SERVICE_URL: http://edgesphere-analytics:3003
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      KAFKA_BROKER: kafka:9092
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "100"
      LOG_LEVEL: info
    ports:
      - "${GATEWAY_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  # 🔐  Auth Service — Port 8081
  auth-service:
    build:
      context: ../../
      dockerfile: apps/auth-service/Dockerfile
    container_name: edgesphere-auth
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-edgesphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-edgesphere_secret}
      DB_NAME: ${POSTGRES_DB:-edgesphere}
      JWT_SECRET: ${JWT_SECRET:-edgesphere-super-secret-jwt-key-change-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "${AUTH_PORT:-8081}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  # 🗄️  Storage Service — Port 8082
  storage-service:
    build:
      context: ../../
      dockerfile: apps/storage-service/Dockerfile
    container_name: edgesphere-storage
    restart: unless-stopped
    environment:
      PORT: "3002"
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-edgesphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-edgesphere_secret}
      DB_NAME: ${POSTGRES_DB:-edgesphere}
      JWT_SECRET: ${JWT_SECRET:-edgesphere-super-secret-jwt-key-change-in-production}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_123}
      MINIO_USE_SSL: "false"
    ports:
      - "${STORAGE_PORT:-8082}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edgesphere-net

  # 📈  Analytics Service — Port 8083
  analytics-service:
    build:
      context: ../../
      dockerfile: apps/analytics-service/Dockerfile
    container_name: edgesphere-analytics
    restart: unless-stopped
    environment:
      PORT: "3003"
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-edgesphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-edgesphere_secret}
      DB_NAME: ${POSTGRES_DB:-edgesphere}
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: analytics-service
      KAFKA_GROUP_ID: analytics-group
      LOG_LEVEL: info
    ports:
      - "${ANALYTICS_PORT:-8083}:3003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - edgesphere-net

  # 💊  Cache Service — Port 8084
  cache-service:
    build:
      context: ../../
      dockerfile: apps/cache-service/Dockerfile
    container_name: edgesphere-cache
    restart: unless-stopped
    environment:
      PORT: "3004"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-change-in-production}
      NODE_ENV: development
    ports:
      - "${CACHE_PORT:-8084}:3004"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  # 🔔  Notification Service — Port 8085
  notification-service:
    build:
      context: ../../
      dockerfile: apps/notification-service/Dockerfile
    container_name: edgesphere-notifications
    restart: unless-stopped
    environment:
      PORT: "3005"
      NODE_ENV: development
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-group
      ANALYTICS_SERVICE_URL: http://edgesphere-analytics:3003
      SMTP_HOST: smtp.ethereal.email
      SMTP_PORT: "587"
      SMTP_FROM: alerts@edgesphere.local
      ALERT_EMAIL_TO: admin@edgesphere.local
      WEBHOOK_URL: http://edgesphere-gateway:3000/internal/webhooks
      ALERT_CHECK_INTERVAL_SECONDS: "60"
      ALERT_DEBOUNCE_MINUTES: "10"
    ports:
      - "${NOTIFICATIONS_PORT:-8085}:3005"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - edgesphere-net

  # 🔌  WebSocket Gateway — Port 8086
  websocket-gateway:
    build:
      context: ../../
      dockerfile: apps/websocket-gateway/Dockerfile
    container_name: edgesphere-ws
    restart: unless-stopped
    environment:
      PORT: "3006"
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: websocket-gateway
      KAFKA_GROUP_ID: websocket-group
    ports:
      - "${WEBSOCKET_PORT:-8086}:3006"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - edgesphere-net

  # 🌐  CDN Edge A — Port 8087
  cdn-service-a:
    build:
      context: ../../
      dockerfile: apps/cdn-service/Dockerfile
    container_name: edgesphere-cdn-a
    restart: unless-stopped
    environment:
      PORT: "3007"
      EDGE_REGION: us-east-1
      ORIGIN_URL: http://edgesphere-storage:3002
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      CACHE_TTL_SECONDS: "3600"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-change-in-production}
      NODE_ENV: development
    ports:
      - "${CDN_A_PORT:-8087}:3007"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  # 🌐  CDN Edge B — Port 8088
  cdn-service-b:
    build:
      context: ../../
      dockerfile: apps/cdn-service/Dockerfile
    container_name: edgesphere-cdn-b
    restart: unless-stopped
    environment:
      PORT: "3008"
      EDGE_REGION: eu-west-1
      ORIGIN_URL: http://edgesphere-storage:3002
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      CACHE_TTL_SECONDS: "3600"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-change-in-production}
      NODE_ENV: development
    ports:
      - "${CDN_B_PORT:-8088}:3008"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

networks:
  edgesphere-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki_data:
