version: '3.9'

services:
  # ─────────────────────────────
  # Infrastructure
  # ─────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: edgesphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edgesphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgesphere_secret}
      POSTGRES_DB: ${POSTGRES_DB:-edgesphere}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - edgesphere-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edgesphere}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edgesphere-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edgesphere-net
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: edgesphere-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - edgesphere-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  kafka:
    image: bitnami/kafka:latest
    container_name: edgesphere-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - edgesphere-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────
  # Monitoring Stack
  # ─────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: edgesphere-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - edgesphere-net

  grafana:
    image: grafana/grafana:latest
    container_name: edgesphere-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-worldmap-panel
    ports:
      - "3200:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - edgesphere-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: edgesphere-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - edgesphere-net

  loki:
    image: grafana/loki:latest
    container_name: edgesphere-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - edgesphere-net

  # ─────────────────────────────
  # Application Services
  # ─────────────────────────────

  api-gateway:
    build:
      context: ../../apps/gateway
      dockerfile: Dockerfile
    container_name: edgesphere-gateway
    restart: unless-stopped
    env_file:
      - ../../apps/gateway/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  auth-service:
    build:
      context: ../../apps/auth-service
      dockerfile: Dockerfile
    container_name: edgesphere-auth
    restart: unless-stopped
    env_file:
      - ../../apps/auth-service/.env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  storage-service:
    build:
      context: ../../apps/storage-service
      dockerfile: Dockerfile
    container_name: edgesphere-storage
    restart: unless-stopped
    env_file:
      - ../../apps/storage-service/.env
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edgesphere-net

  edge-server-a:
    build:
      context: ../../apps/edge-server
      dockerfile: Dockerfile
    container_name: edgesphere-edge-a
    restart: unless-stopped
    environment:
      EDGE_REGION: us-east-1
      EDGE_PORT: "8080"
      ORIGIN_URL: http://storage-service:3002
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    ports:
      - "8080:8080"
    volumes:
      - edge_a_cache:/cache
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  edge-server-b:
    build:
      context: ../../apps/edge-server
      dockerfile: Dockerfile
    container_name: edgesphere-edge-b
    restart: unless-stopped
    environment:
      EDGE_REGION: eu-west-1
      EDGE_PORT: "8081"
      ORIGIN_URL: http://storage-service:3002
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    ports:
      - "8081:8081"
    volumes:
      - edge_b_cache:/cache
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  # CDN Service (Node.js — replaces Go edge servers)
  cdn-service-a:
    build:
      context: ../../apps/cdn-service
      dockerfile: Dockerfile
    container_name: edgesphere-cdn-a
    restart: unless-stopped
    environment:
      PORT: "8080"
      EDGE_REGION: us-east-1
      ORIGIN_URL: http://storage-service:3002
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      CACHE_TTL_SECONDS: "3600"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-change-me}
      NODE_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      storage-service:
        condition: service_started
    networks:
      - edgesphere-net

  cdn-service-b:
    build:
      context: ../../apps/cdn-service
      dockerfile: Dockerfile
    container_name: edgesphere-cdn-b
    restart: unless-stopped
    environment:
      PORT: "8081"
      EDGE_REGION: eu-west-1
      ORIGIN_URL: http://storage-service:3002
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      CACHE_TTL_SECONDS: "3600"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-change-me}
      NODE_ENV: development
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  cache-service:
    build:
      context: ../../apps/cache-service
      dockerfile: Dockerfile
    container_name: edgesphere-cache
    restart: unless-stopped
    environment:
      PORT: "3004"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-secret-change-me}
      NODE_ENV: development
    ports:
      - "3004:3004"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edgesphere-net

  analytics-service:
    build:
      context: ../../apps/analytics-service
      dockerfile: Dockerfile
    container_name: edgesphere-analytics
    restart: unless-stopped
    environment:
      PORT: "3003"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: edgesphere
      DB_PASSWORD: ${DB_PASSWORD:-edgesphere_secret}
      DB_NAME: edgesphere
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: analytics-service
      KAFKA_GROUP_ID: analytics-group
      NODE_ENV: development
      LOG_LEVEL: info
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - edgesphere-net

  notification-service:
    build:
      context: ../../apps/notification-service
      dockerfile: Dockerfile
    container_name: edgesphere-notifications
    restart: unless-stopped
    environment:
      PORT: "3005"
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-group
      ANALYTICS_SERVICE_URL: http://analytics-service:3003
      SMTP_HOST: smtp.ethereal.email
      SMTP_PORT: "587"
      SMTP_FROM: alerts@edgesphere.local
      ALERT_EMAIL_TO: admin@edgesphere.local
      WEBHOOK_URL: http://gateway:3000/internal/webhooks
      ALERT_CHECK_INTERVAL_SECONDS: "60"
      ALERT_DEBOUNCE_MINUTES: "10"
      NODE_ENV: development
    ports:
      - "3005:3005"
    depends_on:
      kafka:
        condition: service_started
      analytics-service:
        condition: service_started
    networks:
      - edgesphere-net

  websocket-gateway:
    build:
      context: ../../apps/websocket-gateway
      dockerfile: Dockerfile
    container_name: edgesphere-ws
    restart: unless-stopped
    environment:
      PORT: "3006"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: websocket-gateway
      KAFKA_GROUP_ID: websocket-group
      NODE_ENV: development
    ports:
      - "3006:3006"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - edgesphere-net

  dashboard:
    build:
      context: ../../apps/dashboard
      dockerfile: Dockerfile
    container_name: edgesphere-dashboard
    restart: unless-stopped
    env_file:
      - ../../apps/dashboard/.env
    ports:
      - "3100:3000"
    networks:
      - edgesphere-net

  nginx:
    image: nginx:alpine
    container_name: edgesphere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
      - dashboard
    networks:
      - edgesphere-net

networks:
  edgesphere-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki_data:
  edge_a_cache:
  edge_b_cache:
